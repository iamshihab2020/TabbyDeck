name: CI

# Tests every push and pull request. Pushing a version tag (v0.2.0) also builds tabbydeck.exe and publishes the release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @tabbydeck/deck -w @tabbydeck/editor

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Zip the app with its licence
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $zip = "TabbyDeck-$v-windows-x64.zip"
          New-Item -ItemType Directory -Force stage/TabbyDeck | Out-Null
          Copy-Item -Recurse out/TabbyDeck/* stage/TabbyDeck/
          Copy-Item LICENSE, NOTICE stage/TabbyDeck/
          Compress-Archive -Path stage/TabbyDeck -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()) *$zip" | Set-Content SHA256SUMS.txt
          "ZIP=$zip" >> $env:GITHUB_ENV
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' $env:ZIP SHA256SUMS.txt --title "TabbyDeck ${{ github.ref_name }}" --generate-notes --verify-tag
